[main]
include=~/.cache/niri-desktop/fuzzel-colors.ini

# Set the default terminal emulator
terminal=xfce4-terminal

# Set the layer for the fuzzel window (top or overlay)
layer=overlay

# Set the font and size
font=Noto Sans:size=14:weight=semibold

# Set the prompt text
prompt=>

# Number of lines to display in the match list
lines=12

# Exit when the fuzzel window loses keyboard focus
exit-on-keyboard-focus-loss=yes

[border]
# Border width in pixels
width=2

# Border radius in pixels
radius=0

[key-bindings]
# Override default key bindings or set custom ones
# Example: Bind Control+k to move to the next item
next=Shift+j
prev=Shift+k
